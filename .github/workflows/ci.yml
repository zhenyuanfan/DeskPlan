name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DeskPlan.slnx
      - run: dotnet test DeskPlan.slnx -c Release --no-restore
      - name: Offscreen WPF layout checks (fictional data only)
        run: dotnet run --project tools/DeskPlan.VisualChecks/DeskPlan.VisualChecks.csproj -c Release -- artifacts/visual-checks
      - run: dotnet publish src/DeskPlan/DeskPlan.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/ci
